<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CEU Periodontal Patient Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a clinic record — navy section bands on white sheets, one sheet per page of the paper form */
:root{
  --desk:#e8ecf2; --paper:#ffffff; --ink:#1a2333; --muted:#5b6578; --line:#c6cedb; --grid:#dfe4ec;
  --field:#f6f8fb; --field-line:#cbb9a6; --auto:#edf2f9; --auto-line:#b9c6da;
  --navy:#1f365c; --on-navy:#ffffff; --band:#dde5f2; --band-ink:#1f365c; --focus:#2d6cdf;
  --bop:#d6372e; --pl:#7b3bd0; --sup:#e88912; --gm:#d6372e; --pb:#2a5ec3;
  --root:#e7d7b2; --crown:#ffffff; --tstroke:#4c4c4c; --cej:#7f899a; --implant:#bcc3ce; --miss:#eceff4;
  --hl:#fff4cc; --ok:#2f7d4a;
  --sans:"Source Sans 3","Segoe UI",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#0c1016; --paper:#141a23; --ink:#e3e8f0; --muted:#9aa5b6; --line:#2d3848; --grid:#222c3b;
  --field:#0f141c; --field-line:#5a4d3f; --auto:#18212e; --auto-line:#34445c;
  --navy:#29497d; --on-navy:#ffffff; --band:#1b2638; --band-ink:#c8d6ee; --focus:#6ea0ff;
  --bop:#ff675c; --pl:#b48bff; --sup:#ffae4a; --gm:#ff675c; --pb:#6ea0ff;
  --root:#6b5c3e; --crown:#cdd3dc; --tstroke:#a9b2c1; --cej:#7d8899; --implant:#5a6474; --miss:#1a212d;
  --hl:#3a3218; --ok:#6cc48b; color-scheme:dark; } }
:root[data-theme="dark"]{
  --desk:#0c1016; --paper:#141a23; --ink:#e3e8f0; --muted:#9aa5b6; --line:#2d3848; --grid:#222c3b;
  --field:#0f141c; --field-line:#5a4d3f; --auto:#18212e; --auto-line:#34445c;
  --navy:#29497d; --on-navy:#ffffff; --band:#1b2638; --band-ink:#c8d6ee; --focus:#6ea0ff;
  --bop:#ff675c; --pl:#b48bff; --sup:#ffae4a; --gm:#ff675c; --pb:#6ea0ff;
  --root:#6b5c3e; --crown:#cdd3dc; --tstroke:#a9b2c1; --cej:#7d8899; --implant:#5a6474; --miss:#1a212d;
  --hl:#3a3218; --ok:#6cc48b; color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.4 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1180px;margin:0 auto}
.bar-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand b{font-size:15px;color:var(--navy)} :root .brand b{color:var(--band-ink)}
.brand span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.nav{display:flex;gap:4px;overflow-x:auto;padding:8px 0;scrollbar-width:thin}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.nav a b{font-variant-numeric:tabular-nums;color:var(--ink);margin-right:4px}
.nav a.on{border-color:var(--navy);color:var(--ink);background:var(--band)}
.note{max-width:1180px;margin:12px auto 0;font-size:13px;color:var(--muted)}

/* sheets */
.page{background:var(--paper);max-width:1180px;margin:14px auto 0;padding:22px 24px 14px;border:1px solid var(--line);scroll-margin-top:110px}
.pf{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;border-top:1px solid var(--grid);margin-top:18px;padding-top:8px}
.mast{display:grid;grid-template-columns:70px 1fr 90px;align-items:center;gap:12px;text-align:center;border-bottom:1px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.mast img{width:100%;height:auto}
.mast .seal{border-radius:50%}
.mast h1{margin:0;font-size:clamp(19px,3.2vw,28px);font-weight:700;color:var(--navy);letter-spacing:.01em;text-wrap:balance;text-transform:uppercase}
:root .mast h1{color:var(--band-ink)}
.mast p{margin:2px 0 0;color:var(--muted)}
.sec{margin-top:16px}
.sec>h2{margin:0;background:var(--navy);color:var(--on-navy);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px}
.sec>h3{margin:10px 0 0;background:var(--band);color:var(--band-ink);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px}
.sb{padding:12px 0 2px;display:grid;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* fields */
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.f{flex:var(--w,1) 1 calc(var(--w,1) * 140px);display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span,.ta>span{font-size:12.5px;color:var(--muted)}
.f.auto>span::after{content:"auto";margin-left:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
input[type=text],input[type=date],input[type=email],input[type=tel],textarea{width:100%;border:1px solid var(--field-line);background:var(--field);color:var(--ink);border-radius:3px;font:inherit;font-size:15px}
input[type=text],input[type=date],input[type=email],input[type=tel]{height:36px;padding:0 8px}
input[readonly]{background:var(--auto);border-color:var(--auto-line);font-variant-numeric:tabular-nums}
textarea{padding:7px 8px;resize:vertical;min-height:64px;line-height:1.45;display:block}
.ta{display:flex;flex-direction:column;gap:3px}
.ta small{font-size:12px;color:var(--muted)}
.g{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px}
.g.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 16px}
.gl{font-weight:700;font-size:14px}
.ck{display:inline-flex;align-items:center;gap:7px;min-height:32px;cursor:pointer;font-size:14.5px}
.ck input,.sq input{width:19px;height:19px;margin:0;accent-color:var(--navy);flex:none}
.inline{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.inline .f{flex:0 1 auto}
.inline .f input{width:auto;min-width:0}

/* image slots */
.slot{margin:0;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;position:relative}
.slot figcaption{background:var(--band);color:var(--band-ink);font-size:12.5px;font-weight:700;text-align:center;padding:3px 4px;border-bottom:1px solid var(--line)}
.drop{display:grid;place-items:center;border:0;background:transparent;margin:5px;border:1px dashed var(--line);height:var(--h,150px);cursor:pointer;padding:0;overflow:hidden;color:var(--muted);font-size:12.5px;text-align:center}
.drop img{width:100%;height:100%;object-fit:contain;background:#000}
.drop:hover{border-color:var(--navy);color:var(--ink)}
.rm{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.idblock{display:grid;grid-template-columns:150px 1fr 150px;gap:0;border:1px solid var(--line)}
.idblock .slot{border:0}
.idblock .drop{--h:190px}
.idblock .ta{padding:6px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.idblock .ta>span{background:var(--band);color:var(--band-ink);font-weight:700;text-align:center;margin:-6px -6px 4px;padding:3px;font-size:12.5px}
.idblock textarea{flex:1}
.ph-ex{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ph-ex .wide{grid-column:2 / span 2}
.ph-ex .drop{--h:250px}
.ph-ex .wide .drop{--h:200px}
.ph-in{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph-in .drop{--h:190px}
.rad h4{margin:4px 0 6px;font-size:13px;color:var(--band-ink);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.rad h4 small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.pa{display:grid;grid-template-columns:3fr 3fr 2fr 2fr 2fr 3fr 3fr;gap:8px}
.pa .drop{--h:150px}
.bw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:920px;margin:0 auto;width:100%}
.bw .drop{--h:160px}
.pano{display:grid;grid-template-columns:2.3fr 1fr;gap:12px}
.pano .drop{--h:320px}
.xs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.xs .drop{--h:170px}
.xs .row{padding:0 5px 6px;gap:6px}
.xs .f{flex-basis:60px}

/* chart */
.chart-tools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;color:var(--muted)}
.keys{display:flex;gap:12px;flex-wrap:wrap}
.key{display:inline-flex;align-items:center;gap:5px}
.key i{width:11px;height:11px;border-radius:50%;display:inline-block}
.key .l{width:18px;height:3px;border-radius:2px}
.cw{overflow-x:auto;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
table.chart{border-collapse:collapse;table-layout:fixed;width:calc(122px + 16 * 72px)}
.chart col.lab{width:122px}.chart col.t{width:72px}
.chart th{position:sticky;left:0;z-index:2;background:var(--paper);text-align:left;font-size:12.5px;font-weight:600;padding:0 6px;border-right:1px solid var(--line);white-space:nowrap}
.chart td{border-left:1px solid var(--line);padding:2px 3px;height:27px}
.chart tr>*{border-top:1px solid var(--grid)}
.chart td.mid{border-left:2px solid var(--navy)}
.chart tr.sh>*{background:color-mix(in srgb,var(--band) 45%,var(--paper))}
.chart tr.sh th{background:color-mix(in srgb,var(--band) 45%,var(--paper))}
.tri{display:flex;gap:1px;align-items:center;justify-content:space-around}
.tri>*{flex:1 1 0;min-width:0}
input.num{width:100%;height:23px;padding:0;text-align:center;font:600 14px var(--sans);font-variant-numeric:tabular-nums;border:1px solid var(--field-line);background:var(--field);color:var(--ink);border-radius:2px}
input.num.one{width:100%}
.chart output{display:block;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);height:20px;line-height:20px}
.chart output.hi{color:var(--bop);font-weight:700}
input.num.hi{color:var(--bop)}
.dot{display:grid;place-items:center;cursor:pointer;height:23px}
.dot input{appearance:none;-webkit-appearance:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--muted);margin:0;background:transparent;cursor:pointer}
.dot.bop input:checked{background:var(--bop);border-color:var(--bop)}
.dot.pl input:checked{background:var(--pl);border-color:var(--pl)}
.dot.sup input:checked{background:var(--sup);border-color:var(--sup)}
.sq{display:grid;place-items:center}
.chart th .k{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:middle}
.chart tr.num-row>*{background:var(--navy);color:var(--on-navy);font-weight:700;text-align:center;font-size:14px;height:30px}
.chart tr.num-row th{text-align:left}
.chart tr.gr td{padding:0}
.chart tr.gr th{vertical-align:middle;white-space:normal}
.chart tr.gr th b{display:block;color:var(--band-ink);font-size:14px;letter-spacing:.04em}
.chart tr.gr th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.chart svg{display:block;width:100%;height:auto}
.chart td.gone{background:var(--miss)}
.chart td.gone input.num,.chart td.gone .dot{opacity:.3}
.legend{font-size:12px;color:var(--muted);margin:2px 0 0}
.sumrow .f{flex-basis:110px}

/* diagnosis tables */
.crit{border:1px solid var(--line)}
.crit h3{margin:0;background:var(--band);color:var(--band-ink);font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 10px}
.crit label{display:grid;grid-template-columns:24px 160px 1fr;gap:8px;align-items:start;padding:5px 10px;border-top:1px solid var(--grid);cursor:pointer;font-size:13.5px}
.crit label b{font-size:14px}
.crit label span{color:var(--muted)}
.crit input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--navy)}
.crit label:has(input:checked){background:var(--hl)}
.crit label:has(input:checked) span{color:var(--ink)}
.opgrid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.opgrid>div{border-left:1px solid var(--line);padding:0 0 8px}
.opgrid>div:first-child{border-left:0}
.opgrid h4{margin:0 0 4px;background:var(--band);color:var(--band-ink);font-size:13px;padding:4px 8px}
.opgrid .ck{display:flex;padding:0 8px;min-height:28px;font-size:14px}
.opgrid .ck.sub{padding-left:30px}
.band{display:grid;grid-template-columns:150px repeat(5,1fr);border:1px solid var(--line);font-size:13px;text-align:center}
.band>div{padding:4px 6px;border-left:1px solid var(--line)}
.band>.h{background:var(--navy);color:var(--on-navy);font-weight:700;text-align:left;border-left:0}
.band>.n{background:var(--navy);color:var(--on-navy);font-weight:700}
.band>.lbl{font-weight:700;text-align:left;border-left:0;border-top:1px solid var(--line)}
.band>.p{border-top:1px solid var(--line)}
.band>.on{background:var(--hl);font-weight:700}
.defs{width:100%;border-collapse:collapse;font-size:13.5px}
.defs td{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
.defs td:first-child{font-weight:700;color:var(--band-ink);background:var(--band);width:140px}
.ip{border-collapse:collapse;table-layout:fixed;width:calc(130px + 16 * 46px);font-size:12.5px}
.ip col.lab{width:130px}.ip col.t{width:46px}
.ip th,.ip td{border:1px solid var(--line);text-align:center;height:28px;padding:0}
.ip th{position:sticky;left:0;background:var(--paper);text-align:left;padding:0 6px;font-weight:600}
.ip tr.hd>*{background:var(--navy);color:var(--on-navy);font-weight:700}
.ip td.mid{border-left:2px solid var(--navy)}
.ip td input{width:18px;height:18px;margin:0;accent-color:var(--navy);vertical-align:middle}
.ipw{overflow-x:auto}

/* consent */
.consent{font-size:14px;margin:0;max-width:85ch}
.sig{display:grid;grid-template-columns:150px 1.2fr 1.4fr 150px;border:1px solid var(--line)}
.sig>div{padding:6px 8px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.sig>.who{border-left:0;font-weight:700;justify-content:center}
.sig>.who small{font-weight:400;color:var(--muted)}
.sig>div:nth-child(-n+4){border-top:0}
.sig label>span{font-size:12px;color:var(--muted)}
.pad{position:relative}
.pad canvas{width:100%;height:96px;display:block;border:1px dashed var(--field-line);background:#fbfbf8;border-radius:3px;touch-action:none;cursor:crosshair}
.pad .clr{position:absolute;right:4px;top:4px;font-size:11.5px;padding:1px 7px;border:1px solid var(--line);background:var(--paper);border-radius:4px;cursor:pointer}
.pad .sl{font-size:12px;color:var(--muted)}

/* dialog & toast */
dialog{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;max-width:420px;padding:20px}
dialog::backdrop{background:rgb(10 15 25 / .45)}
dialog h3{margin:0 0 6px;font-size:17px}
dialog p{margin:0 0 16px;color:var(--muted)}
dialog .acts{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:9px 16px;border-radius:6px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}

@media screen and (max-width:820px){
  .page{padding:16px 12px 12px}
  .idblock{grid-template-columns:1fr 1fr}
  .idblock .ta{grid-column:1 / -1;grid-row:2;border:0;border-top:1px solid var(--line)}
  .ph-ex{grid-template-columns:repeat(2,1fr)}.ph-ex .wide{grid-column:1 / -1}
  .ph-in{grid-template-columns:repeat(2,1fr)}
  .pa{grid-template-columns:repeat(4,1fr)}.pa .drop{--h:120px}
  .bw{grid-template-columns:repeat(2,1fr)}
  .pano{grid-template-columns:1fr}.pano .drop{--h:220px}
  .xs{grid-template-columns:repeat(3,1fr)}
  .opgrid{grid-template-columns:1fr 1fr}.opgrid>div:nth-child(3){border-left:0}.opgrid>div:nth-child(n+3){border-top:1px solid var(--line)}
  .crit label{grid-template-columns:24px 1fr}.crit label span{grid-column:2}
  .band{grid-template-columns:110px repeat(5,minmax(0,1fr));font-size:11.5px}
  .sig{grid-template-columns:1fr 1fr}
  .sig>div{border-left:0}
  .sig>.who{grid-column:1 / -1;border-top:2px solid var(--line)!important}
  .sig>div:nth-child(-n+4){border-top:1px solid var(--line)}
  .sig>div:first-child{border-top:0!important}
  .sig>.sgn{grid-column:1 / -1}
}
@media screen and (max-width:480px){
  .mast{grid-template-columns:44px 1fr 56px;gap:8px}
  .pa{grid-template-columns:repeat(3,1fr)}
  .xs{grid-template-columns:repeat(2,1fr)}
  .ph-in{grid-template-columns:1fr 1fr}
  .opgrid{grid-template-columns:1fr}.opgrid>div{border-left:0;border-top:1px solid var(--line)}
  .opgrid>div:first-child{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

@page{size:A4 portrait;margin:9mm}
@page land{size:A4 landscape;margin:7mm 8mm}
@media print{
  :root:root:root{--desk:#fff;--paper:#fff;--ink:#111;--muted:#444;--line:#9aa6b8;--grid:#d4dae3;--field:#fff;--field-line:#b8a894;--auto:#fff;--auto-line:#b8a894;
    --navy:#1f365c;--band:#dde5f2;--band-ink:#1f365c;--bop:#d6372e;--pl:#7b3bd0;--sup:#e88912;--gm:#d6372e;--pb:#2a5ec3;--root:#e7d7b2;--crown:#fff;--tstroke:#4c4c4c;--cej:#7f899a;--implant:#bcc3ce;--miss:#eceff4;--hl:#fff4cc;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0;font-size:12px;background:#fff}
  body::before,.bar,.note,.rm,.clr,.chart-tools .tog,.noprint,.toast{display:none!important}
  .page{border:0;margin:0;padding:0;max-width:none;break-before:page}
  .page:first-of-type{break-before:auto}
  .page.land{page:land}
  .f.auto>span::after{display:none}
  .sb{gap:7px;padding-top:7px}.sec{margin-top:9px}
  input[type=text],input[type=date],input[type=email],input[type=tel]{height:22px;font-size:11.5px;padding:0 5px}
  .f>span,.ta>span{font-size:10.5px}.row{gap:5px 10px}.g{gap:0 12px}.mast{padding-bottom:6px;margin-bottom:8px}.idblock .drop{--h:150px}
  textarea{font-size:12px;resize:none;min-height:40px}
  .ck{min-height:20px;font-size:12px}.ck input{width:13px;height:13px}
  .g.cols{grid-template-columns:repeat(3,1fr)}
  .drop{border-style:solid}.drop .hint{visibility:hidden}
  .drop img{background:#fff}
  .cw,.ipw{overflow:visible;border:0}
  .chart{zoom:.68}.chart td{height:22px}input.num{height:19px;font-size:12px}.dot{height:19px}.legend{font-size:10px}
  .ip{zoom:.82}
  .chart th{position:static}
  .slot,.crit,.opgrid,.band,.sig,table,.row,.g,.ta{break-inside:avoid}.sec>h2{break-after:avoid}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const slug=s=>s.toLowerCase().replace(/>=/g,'ge').replace(/>/g,'gt').replace(/</g,'lt').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- builders ---------- */
function F(id,label,o={}){
  const type=o.type||'text', w=o.w?` style="--w:${o.w}"`:'';
  const a=(o.num?' inputmode="decimal"':'')+(o.auto?' readonly tabindex="-1"':'')+(o.ph?` placeholder="${esc(o.ph)}"`:'')+(o.size?` size="${o.size}"`:'');
  return `<label class="f${o.auto?' auto':''}"${w}><span>${label}</span><input id="${id}" type="${type}"${a} autocomplete="off"></label>`;
}
function G(id,label,opts,o={}){
  const s=o.single?' data-single':'';
  return `<div class="g${o.cols?' cols':''}">${label?`<span class="gl">${label}</span>`:''}${opts.map(x=>`<label class="ck"><input type="checkbox" id="${id}_${slug(x)}" data-g="${id}"${s}><span>${esc(x)}</span></label>`).join('')}</div>`;
}
function T(id,label,o={}){
  return `<label class="ta">${label?`<span>${label}</span>`:''}${o.hint?`<small>${o.hint}</small>`:''}<textarea id="${id}" rows="${o.rows||3}"${label?'':` aria-label="${esc(o.aria||id)}"`}></textarea></label>`;
}
const R=(...x)=>`<div class="row">${x.join('')}</div>`;
const IN=(...x)=>`<div class="inline">${x.join('')}</div>`;
const SEC=(t,b,id)=>`<div class="sec"${id?` id="${id}"`:''}><h2>${t}</h2><div class="sb">${b}</div></div>`;
function PH(id,label,o={}){
  return `<figure class="slot${o.cls?' '+o.cls:''}" data-slot="${id}" data-max="${o.max||1400}"><figcaption>${label}</figcaption><button type="button" class="drop" aria-label="Add image: ${esc(label)}"><img alt="${esc(label)}" hidden><span class="hint">${o.hint||'Tap to add photo'}</span></button><button type="button" class="rm" hidden>Remove</button><input type="file" accept="image/*" hidden>${o.after||''}</figure>`;
}
const FOOT=n=>`<footer class="pf"><span>Periodontal Patient Assessment &amp; Record Form by Calingo, Encina, Gerochi, Magtibay, Reyes, and Wong, Ver. 1 Series 2026 · web version</span><span>Page ${n} of 11</span></footer>`;
const PAGE=(n,b,land)=>`<section class="page${land?' land':''}" id="p${n}">${b}${FOOT(n)}</section>`;

function toothSVG(n,cx,cej,dir,implant){
  const d=n%10, up=Math.floor(n/10)<=2;
  const cw={1:up?44:30,2:up?36:32,3:40,4:40,5:38,6:58,7:54,8:48}[d];
  const ch={1:up?9:8,2:8.5,3:9,4:8,5:7.5,6:7,7:6.5,8:6}[d];
  const rl={1:13,2:13,3:16.5,4:14,5:14,6:13,7:12.5,8:11}[d];
  const c=-dir, a=cw*.36, b=cw/2, o=cw*.44, h=ch*SC;
  const yk=cej+c*h*.86, ym=cej+c*h*.5, yp=cej+c*h;
  let top;
  if(d<=2) top=`L${cx-o},${yp} L${cx+o},${yp}`;
  else if(d===3) top=`L${cx-o},${yk} L${cx},${yp} L${cx+o},${yk}`;
  else if(d<=5) top=`L${cx-o},${yk} Q${cx},${cej+c*h*1.14} ${cx+o},${yk}`;
  else top=`L${cx-o},${yk} Q${cx-o*.5},${cej+c*h*1.12} ${cx},${yk} Q${cx+o*.5},${cej+c*h*1.12} ${cx+o},${yk}`;
  const crown=`<path d="M${cx-a},${cej} Q${cx-b-1},${ym} ${top.replace(/^L/,'')} Q${cx+b+1},${ym} ${cx+a},${cej} Z" fill="var(--crown)" stroke="var(--tstroke)" stroke-width="1"/>`.replace(`Q${cx-b-1},${ym} ${cx-o}`,`Q${cx-b-1},${ym} ${cx-o}`);
  const ap=cej+dir*rl*SC, md=cej+dir*rl*SC*.5;
  let root;
  if(implant){
    const w=a*.75; let th='';
    for(let m=1;m<rl-1;m+=1.5){const y=cej+dir*m*SC;th+=`<line x1="${cx-w}" y1="${y}" x2="${cx+w}" y2="${y+dir*2}" stroke="var(--tstroke)" stroke-width=".6"/>`}
    root=`<path d="M${cx-w},${cej} L${cx-w*.8},${ap-dir*4} L${cx},${ap} L${cx+w*.8},${ap-dir*4} L${cx+w},${cej} Z" fill="var(--implant)" stroke="var(--tstroke)" stroke-width="1"/>${th}`;
  } else if(d>=6 || ((d===4)&&up)){
    const fu=cej+dir*(d===4?7:3.5)*SC, k=d===4?.8:1;
    root=`<path d="M${cx-a},${cej} Q${cx-a*1.05},${md} ${cx-a*.62*k},${ap} Q${cx-a*.2},${md} ${cx},${fu} Q${cx+a*.2},${md} ${cx+a*.62*k},${ap} Q${cx+a*1.05},${md} ${cx+a},${cej} Z" fill="var(--root)" stroke="var(--tstroke)" stroke-width="1"/>`;
  } else {
    const r=a*.95;
    root=`<path d="M${cx-r},${cej} Q${cx-r*.85},${md} ${cx},${ap} Q${cx+r*.85},${md} ${cx+r},${cej} Z" fill="var(--root)" stroke="var(--tstroke)" stroke-width="1"/>`;
  }
  return root+crown;
}
function drawGraph(k,pos){
  const A=ARCH[k], s=pos==='top'?A.top:A.bot, rootsUp=pos==='top', dir=rootsUp?-1:1;
  const cej=rootsUp?GP+ROOTMM*SC:GP+CROWN*SC, y=mm=>cej+dir*Math.max(-CROWN,Math.min(ROOTMM,mm))*SC;
  let g='';
  A.teeth.forEach((n,i)=>{const cx=i*TW+TW/2; if(isOn(`c_${n}_miss`)) g+=`<rect x="${i*TW}" y="0" width="${TW}" height="${GH}" fill="var(--miss)"/>`; else g+=toothSVG(n,cx,cej,dir,isOn(`c_${n}_imp`));});
  for(let m=-CROWN;m<=ROOTMM;m++){if(m===0)continue;const yy=y(m);g+=`<line x1="0" y1="${yy}" x2="${16*TW}" y2="${yy}" stroke="var(--grid)" stroke-width=".7" opacity=".9"/>`}
  g+=`<line x1="0" y1="${cej}" x2="${16*TW}" y2="${cej}" stroke="var(--cej)" stroke-width="1" stroke-dasharray="4 3"/>`;
  g+=`<line x1="${8*TW}" y1="0" x2="${8*TW}" y2="${GH}" stroke="var(--navy)" stroke-width="2"/>`;
  for(let i=1;i<16;i++) if(i!==8) g+=`<line x1="${i*TW}" y1="0" x2="${i*TW}" y2="${GH}" stroke="var(--line)" stroke-width=".8"/>`;
  const mSegs=[[]], bSegs=[[]];
  A.teeth.forEach((n,i)=>{
    const miss=isOn(`c_${n}_miss`);
    for(let j=0;j<3;j++){
      const x=i*TW+TW/2+(j-1)*22, pd=numv(`c_${n}_${s}_pd_${j}`), rec=numv(`c_${n}_${s}_rec_${j}`);
      const has=!miss&&(pd!==null||rec!==null);
      if(has){mSegs[mSegs.length-1].push([x,y(rec||0)])} else if(mSegs[mSegs.length-1].length) mSegs.push([]);
      if(!miss&&pd!==null){bSegs[bSegs.length-1].push([x,y((rec||0)+pd)])} else if(bSegs[bSegs.length-1].length) bSegs.push([]);
    }
  });
  const draw=(segs,col)=>segs.filter(s=>s.length).map(s=>(s.length>1?`<polyline points="${s.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`:'')+s.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${col}"/>`).join('')).join('');
  g+=draw(mSegs,'var(--gm)')+draw(bSegs,'var(--pb)');
  document.getElementById(`g_${k}_${pos}`).innerHTML=g;
}

/* ---------- calculations ---------- */
function setv(id,v){const e=document.getElementById(id);if(e&&e.value!==String(v))e.value=v}
function recompute(){
  const all={sites:0,bop:0,pl:0,sup:0,pd45:0,pd6:0,calSum:0,calN:0,deep:null,maxcal:null,present:0,missing:[],implants:[],mob:[],fur:[],any:false};
  for(const k of ['max','man']){
    const A=ARCH[k]; let pd4=0,bop=0,sites=0,deep=null,any=false;
    for(const n of A.teeth){
      const miss=isOn(`c_${n}_miss`);
      $$(`#t_${k} td[data-t="${n}"]`).forEach(td=>td.classList.toggle('gone',miss));
      if(miss){all.missing.push(n);for(const s of [A.top,A.bot])for(let j=0;j<3;j++)document.getElementById(`c_${n}_${s}_cal_${j}`).textContent='';continue}
      all.present++; sites+=6;
      if(isOn(`c_${n}_imp`))all.implants.push(n);
      const mob=numv(`c_${n}_mob`); if(mob!==null&&mob>=2)all.mob.push(n); if(mob!==null)any=true;
      let fmax=0;
      for(const s of [A.top,A.bot]){
        const fv=furv(val(`c_${n}_${s}_fur`)); if(fv!==undefined){any=true;fmax=Math.max(fmax,fv)}
        for(let j=0;j<3;j++){
          const pd=numv(`c_${n}_${s}_pd_${j}`), rec=numv(`c_${n}_${s}_rec_${j}`), o=document.getElementById(`c_${n}_${s}_cal_${j}`);
          const pdEl=document.getElementById(`c_${n}_${s}_pd_${j}`);
          if(isOn(`c_${n}_${s}_bop_${j}`)){bop++;all.bop++;any=true}
          if(isOn(`c_${n}_${s}_pl_${j}`)){all.pl++;any=true}
          if(isOn(`c_${n}_${s}_sup_${j}`)){all.sup++;any=true}
          pdEl.classList.toggle('hi',pd!==null&&pd>=4);
          if(pd===null){o.textContent='';o.classList.remove('hi');continue}
          any=true;
          const cal=rec===null?0:pd+rec;
          o.textContent=cal; o.classList.toggle('hi',cal>=5);
          all.calSum+=cal; all.calN++;
          if(pd>=4)pd4++; if(pd>=4&&pd<=5)all.pd45++; if(pd>=6)all.pd6++;
          if(deep===null||pd>deep[0])deep=[pd,n];
          if(all.deep===null||pd>all.deep[0])all.deep=[pd,n];
          if(all.maxcal===null||cal>all.maxcal[0])all.maxcal=[cal,n];
        }
      }
      if(fmax>=2)all.fur.push(n);
    }
    all.sites+=sites; if(any)all.any=true;
    setv(k+'_s_pd4',any?pd4:''); setv(k+'_s_bop',any?bop:''); setv(k+'_s_bopp',any&&sites?(bop/sites*100).toFixed(1):''); setv(k+'_s_deep',deep?`${deep[0]} / ${deep[1]}`:'');
    drawGraph(k,'top'); drawGraph(k,'bot');
  }
  const anyM=all.any||all.missing.length>0;
  setv('ix_ps',all.any&&all.sites?(all.pl/all.sites*100).toFixed(1):'');
  setv('ix_bop',all.any&&all.sites?(all.bop/all.sites*100).toFixed(1):'');
  setv('ix_present',anyM?all.present:'');
  setv('ix_missing',all.missing.join(', '));
  setv('ix_implants',all.implants.join(', '));
  setv('ix_sup',all.any?all.sup:'');
  setv('ix_meancal',all.calN?(all.calSum/all.calN).toFixed(1):'');
  setv('ix_pd45',all.any?all.pd45:''); setv('ix_pd6',all.any?all.pd6:'');
  setv('ix_deeppd',all.deep?`${all.deep[0]} / ${all.deep[1]}`:'');
  setv('ix_maxcal',all.maxcal?`${all.maxcal[0]} / ${all.maxcal[1]}`:'');
  setv('ix_mob',all.mob.join(', ')); setv('ix_fur',all.fur.join(', '));
  // overall prognosis
  const sc=$$('.opi').filter(e=>e.checked).length;
  const bands=['GOOD','FAIR','POOR','QUESTIONABLE','HOPELESS'], bi=sc?Math.min(4,Math.floor((sc-1)/3)):-1;
  setv('op_score',sc||''); setv('op_overall',bi<0?'':bands[bi]);
  $$('#opband .p').forEach((e,i)=>e.classList.toggle('on',i===bi));
  // individual prognosis list
  const q=[],h=[];
  for(const n of [...UP,...LO]){ if(isOn(`ip_${n}_questionable`))q.push(n); if(isOn(`ip_${n}_hopeless`))h.push(n); }
  setv('ip_list',[q.length?`Questionable: ${q.join(', ')}`:'',h.length?`Hopeless: ${h.join(', ')}`:''].filter(Boolean).join(' · '));
  // header
  const cs=val('pt_case'), nm=val('pt_name');
  $('#who').textContent=(nm||cs)?[nm,cs?`Case ${cs}`:''].filter(Boolean).join(' · ')+(dirty?' · unsaved changes':' · saved'):(dirty?'New record · unsaved changes':'New record · not saved');
}
let rq=0; const schedule=()=>{if(!rq)rq=requestAnimationFrame(()=>{rq=0;recompute()})};

/* helper auto-fills that stay editable */
function calcAge(){
  const dob=val('pt_dob'); if(!dob)return;
  const ref=val('pt_examdate')?new Date(val('pt_examdate')):new Date(), b=new Date(dob);
  let a=ref.getFullYear()-b.getFullYear(); const m=ref.getMonth()-b.getMonth();
  if(m<0||(m===0&&ref.getDate()<b.getDate()))a--;
  if(a>=0&&a<130){setv('pt_age',a);calcBLA()}
}
function calcBLA(){const bl=numv('rx_bl'),age=numv('pt_age'); if(bl!==null&&age)setv('rx_blage',(bl/age).toFixed(2))}
function calcPY(){const c=numv('rf_cig'),y=numv('rf_years'); if(c!==null&&y!==null)setv('rf_py',(c/20*y).toFixed(1))}

/* ---------- events ---------- */
let dirty=false;
const form=$('#form');
form.addEventListener('input',e=>{
  dirty=true; const t=e.target;
  if(t.id==='pt_dob'||t.id==='pt_examdate')calcAge();
  if(t.id==='rx_bl'||t.id==='pt_age')calcBLA();
  if(t.id==='rf_cig'||t.id==='rf_years')calcPY();
  if(t.tagName==='TEXTAREA')grow(t);
  if(t.classList.contains('num')&&(t.classList.contains('pd')||t.classList.contains('rec'))){
    const adv=t.closest('.sec').querySelector('.adv');
    if(adv&&adv.checked&&/^-?\d$|^\d\d$/.test(t.value))next(t);
  }
  schedule();
});
form.addEventListener('change',e=>{
  const t=e.target; dirty=true;
  if(t.type==='checkbox'&&t.dataset.single!==undefined&&t.checked){
    $$(`input[data-g="${t.dataset.g}"]`).forEach(o=>{if(o!==t)o.checked=false});
  }
  const m=t.id.match(/^c_(\d\d)_miss$/);
  if(m){const n=m[1];
    if(t.checked){$$(`input[data-g="ip_${n}"]`).forEach(o=>o.checked=o.id===`ip_${n}_missing`)}
    else{const x=document.getElementById(`ip_${n}_missing`);if(x)x.checked=false}
    $$(`#form td[data-t="${n}"] input:not([id$="_miss"])`).forEach(i=>i.disabled=t.checked);
  }
  schedule();
});
form.addEventListener('focusin',e=>{const t=e.target;if(t.classList&&t.classList.contains('num'))setTimeout(()=>{if(document.activeElement===t){try{t.select()}catch(_){}}},0)});
form.addEventListener('keydown',e=>{
  const t=e.target; if(!t.classList||!t.classList.contains('num'))return;
  if(e.key==='Enter'){e.preventDefault();next(t)}
});
function rowSeq(t){
  const [k,s]=t.dataset.row.split('_'), A=ARCH[k];
  const order=[`${k}_${A.top}_pd`,`${k}_${A.top}_rec`,`${k}_${A.bot}_pd`,`${k}_${A.bot}_rec`];
  return order.flatMap(r=>$$(`input[data-row="${r}"]`).filter(i=>!i.disabled));
}
function next(t){
  if(!t.dataset.row){const all=$$('input.num',t.closest('table')).filter(i=>!i.disabled);const i=all.indexOf(t);if(all[i+1])all[i+1].focus();return}
  const seq=rowSeq(t), i=seq.indexOf(t); if(seq[i+1])seq[i+1].focus(); else t.blur();
}
function grow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight+2,64)+'px'}

/* ---------- images ---------- */
const IMG={};
function loadImage(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That file could not be read as an image.'))};im.src=u})}
function showImg(slot,data){
  const img=$('img',slot), hint=$('.hint',slot), rm=$('.rm',slot);
  if(data){img.src=data;img.hidden=false;hint.hidden=true;rm.hidden=false}else{img.removeAttribute('src');img.hidden=true;hint.hidden=false;rm.hidden=true}
}
$$('.slot').forEach(slot=>{
  const id=slot.dataset.slot, inp=$('input[type=file]',slot);
  $('.drop',slot).addEventListener('click',()=>inp.click());
  inp.addEventListener('change',async()=>{
    const f=inp.files[0]; inp.value=''; if(!f)return;
    try{const d=await loadImage(f,+slot.dataset.max);IMG[id]=d;showImg(slot,d);dirty=true;schedule()}catch(err){toast(err.message)}
  });
  $('.rm',slot).addEventListener('click',()=>{delete IMG[id];showImg(slot,null);dirty=true;schedule()});
});

/* ---------- signatures ---------- */
const SIGS={};
$$('.pad').forEach(pad=>{
  const id=pad.dataset.sig, cv=$('canvas',pad); let ctx, drawing=false, last=null;
  function size(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111827';ctx.fillStyle='#111827';if(SIGS[id])paint(SIGS[id])}
  function paint(data){const im=new Image();im.onload=()=>{const r=cv.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height)};im.src=data}
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1,0,7);ctx.fill()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p});
  const end=()=>{if(!drawing)return;drawing=false;SIGS[id]=exportSig(cv);dirty=true;schedule()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  $('.clr',pad).addEventListener('click',()=>{delete SIGS[id];size();dirty=true;schedule()});
  pad._size=size; pad._paint=()=>{size()};
  size();
});
function exportSig(cv){return cv.toDataURL('image/png')}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>$$('.pad').forEach(p=>p._size()),150)});

/* ---------- save / open ---------- */
function collect(){
  const f={};
  $$('#form input[id], #form textarea[id]').forEach(e=>{if(e.type==='file'||e.readOnly)return;if(e.type==='checkbox'){if(e.checked)f[e.id]=true}else if(e.value!=='')f[e.id]=e.value});
  return {form:'CEU MS Periodontics · Periodontal Patient Assessment & Record',version:1,saved:new Date().toISOString(),fields:f,images:IMG,signatures:SIGS};
}
function clearAll(){
  $$('#form input[id], #form textarea[id]').forEach(e=>{if(e.type==='checkbox')e.checked=false;else if(e.type!=='file')e.value='';e.disabled=false});
  for(const k in IMG)delete IMG[k]; for(const k in SIGS)delete SIGS[k];
  $$('.slot').forEach(s=>showImg(s,null)); $$('textarea').forEach(t=>t.style.height='');
  $$('.pad').forEach(p=>p._size());
}
function apply(data){
  if(!data||typeof data!=='object'||!data.fields)throw new Error('This file is not a saved periodontal record.');
  clearAll();
  for(const [id,v] of Object.entries(data.fields)){const e=document.getElementById(id);if(!e)continue;if(e.type==='checkbox')e.checked=!!v;else e.value=v}
  Object.assign(IMG,data.images||{}); Object.assign(SIGS,data.signatures||{});
  $$('.slot').forEach(s=>showImg(s,IMG[s.dataset.slot]||null));
  $$('.pad').forEach(p=>p._size());
  $$('textarea').forEach(grow);
  $$('input[id$="_miss"]').forEach(m=>{const n=m.id.slice(2,4);$$(`#form td[data-t="${n}"] input:not([id$="_miss"])`).forEach(i=>i.disabled=m.checked)});
  dirty=false; recompute();
}
function fileName(){
  const c=slug(val('pt_case')||'')||'record', d=val('pt_examdate')||new Date().toISOString().slice(0,10);
  return `perio-${c}-${d}.json`;
}
$('#btnSave').addEventListener('click',async()=>{
  const name=fileName(), blob=new Blob([JSON.stringify(collect())],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  const touch=matchMedia('(pointer:coarse)').matches;
  if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});dirty=false;recompute();toast('Record shared. Choose Google Drive in the list to keep it in your Drive.');return}
    catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  dirty=false;recompute();toast(`Saved ${name}`);
});
$('#btnOpen').addEventListener('click',()=>{
  const go=()=>$('#openFile').click();
  dirty?ask('Open another record?','Changes to the current record that you have not saved will be lost.',go):go();
});
$('#openFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  try{apply(JSON.parse(await f.text()));toast(`Opened ${f.name}`)}catch(err){toast(err instanceof SyntaxError?'This file is not a saved periodontal record.':err.message)}
});
$('#btnNew').addEventListener('click',()=>{
  const go=()=>{clearAll();dirty=false;recompute();scrollTo({top:0});toast('Blank record ready')};
  dirty?ask('Start a new patient?','Everything on this form will be cleared. Save the record first if you need it.',go):go();
});
$('#btnPrint').addEventListener('click',()=>{$$('textarea').forEach(grow);window.print()});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- dialog / toast ---------- */
function ask(t,m,yes){const d=$('#dlg');$('#dlgT').textContent=t;$('#dlgM').textContent=m;$('#dlgYes').onclick=()=>{d.close();yes()};$('#dlgNo').onclick=()=>d.close();d.showModal()}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3600)}

/* ---------- nav highlight ---------- */
const links=$$('#nav a');
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const i=+en.target.id.slice(1)-1;links.forEach((l,j)=>l.classList.toggle('on',i===j));links[i].scrollIntoView({block:'nearest',inline:'nearest'})}})},{rootMargin:'-120px 0px -60% 0px'});
$$('.page').forEach(p=>io.observe(p));

recompute();
</script>
</body>
